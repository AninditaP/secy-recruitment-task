worker_processes  1;
events {
    worker_connections  1024;
}
http{
    include /etc/nginx/mime.types;

    upstream backend {
        server server1:8001 max_fails=1 fail_timeout=15s;
        server server2:8002 max_fails=1 fail_timeout=15s;
    }


  server{
    listen 8080;
    server_name localhost;
    location / {
      proxy_pass http://backend;
  }
}
}